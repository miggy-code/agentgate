[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "agentgate"
version = "0.0.1"
description = "Permissions, approval and audit layer between an AI agent and a company's tools and documents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Miguel Padilla" }]
dependencies = [
    "pydantic>=2.9,<3",
]

[project.urls]
Repository = "https://github.com/miggy-code/agentgate"

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentgate"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
