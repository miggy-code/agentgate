[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "panoptes-agentgate"
version = "0.1.0"
description = "Permissions, approval and audit layer between an AI agent and a company's tools and documents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Miguel Padilla" }]
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=2.3,<3",
    "panoptes-observe[proxy]>=0.2.0,<0.4",
    "pydantic>=2.9,<3",
    "pyjwt[crypto]>=2.10,<3",
    "pyyaml>=6,<7",
    "typer>=0.12,<1",
]

[project.scripts]
agentgate = "agentgate.cli:main"

[project.urls]
Repository = "https://github.com/miggy-code/agentgate"

[project.optional-dependencies]
anthropic = [
    "anthropic>=1.0,<2",
]

[dependency-groups]
dev = [
    "anthropic>=1.0,<2",
    "import-linter>=2.1,<3",
    "mypy>=1.13,<2",
    "pytest>=8,<9",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.8,<1",
    "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentgate"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "keycloak: needs a Keycloak with the test realm (AGENTGATE_KEYCLOAK_URL); skipped without it",
]

# The architecture, enforced: a module may import only from layers below its own. `|` marks
# siblings that may not import each other; `:` siblings may.
[tool.importlinter]
root_package = "agentgate"

[[tool.importlinter.contracts]]
name = "Layers: entry points, adapters, composition, gate, services, foundation"
type = "layers"
layers = [
    "agentgate.cli",
    "agentgate.demo | agentgate.redteam | agentgate.experiment",
    "agentgate.gateway | agentgate.model_proxy",
    "agentgate.agent",
    "agentgate.world",
    "agentgate.gate",
    "agentgate.approvals | agentgate.spend | agentgate.tools | agentgate.audit | agentgate.model | agentgate.identity",
    "agentgate.retrieval",
    "agentgate.policy",
    "agentgate.fixtures",
    "agentgate.store",
    "agentgate.context | agentgate.clock",
    "agentgate.domain",
    "agentgate._json | agentgate._yaml",
]

[[tool.importlinter.contracts]]
name = "The gate's parts are reached only through agentgate.gate"
type = "forbidden"
source_modules = [
    "agentgate.cli",
    "agentgate.demo",
    "agentgate.redteam",
    "agentgate.experiment",
    "agentgate.gateway",
    "agentgate.model_proxy",
    "agentgate.agent",
    "agentgate.world",
]
forbidden_modules = [
    "agentgate.gate._values",
    "agentgate.gate.decisions",
    "agentgate.gate.model_calls",
    "agentgate.gate.operator_log",
    "agentgate.gate.recorder",
    "agentgate.gate.runs",
    "agentgate.gate.tool_calls",
]
allow_indirect_imports = true
