name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      # A tag publishes the version in pyproject.toml, so the two must agree.
      - name: Check that the tag names the built version
        if: github.ref_type == 'tag'
        run: |
          built=$(ls dist/*.whl | sed -E 's/.*-([^-]+)-py3-none-any\.whl/\1/')
          test "v$built" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but built $built"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
