name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Type check
        run: make type

      - name: Test
        run: make test

      - name: Policy tests
        run: make policy

      # Runs the suite twice: in-process, then through the MCP gateway.
      - name: Red-team suite
        run: make redteam

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-python-${{ matrix.python-version }}
          # reports/redteam.{json,md} (gate), reports/redteam-mcp.{json,md} (mcp), and the rest.
          path: reports/
          if-no-files-found: warn
