# Access policy for Kettle Creek Heating & Air. Deny by default: anything no rule allows is denied.
# Precedence: any matching deny wins, then require_approval, then allow.
apiVersion: agentgate/v1
customer: kettle-creek-hvac

# Least to most sensitive.
labels: [public, internal, confidential, restricted]
default: deny

# Platform cost caps for agent runs.
spend:
  per_run_usd: "0.50"
  per_customer_day_usd: "20.00"
  max_calls_per_run: 40

approvals:
  approver_roles: [owner, manager]
  ttl_minutes: 60
  risk_threshold: 50

lists:
  # Company mailboxes only. Exact domain, so subdomains and look-alikes do not match.
  internal_addresses:
    - "@kettlecreek.example"
  # Exact customer addresses from the customer list. Senders seen only in untrusted inbox
  # mail are not added, and no shared consumer domain is listed with @domain.
  customer_directory:
    - beatrice.l@mail-sample.example
    - ruben.c@mail-sample.example
    - imani.r@mail-sample.example
    - anselm.w@mail-sample.example
    - odalys.f@mail-sample.example
    - tobias.m@mail-sample.example
    - yvette.d@mail-sample.example

rules:
  # Reading documents (search and read). One rule per role, each up to that role's ceiling.
  - id: contractor-read-public
    effect: allow
    description: Contractors may search and read public documents.
    roles: [contractor]
    tools: [docs.search, docs.read]
    actions: [read]
    labels: {max: public}

  - id: contractor-read-assigned
    effect: allow
    description: Contractors may read internal documents assigned to them, such as their job tickets.
    roles: [contractor]
    tools: [docs.search, docs.read]
    actions: [read]
    labels: {max: internal}
    where:
      doc_assigned_to_user: true

  - id: contractor-read-sop
    effect: allow
    description: Contractors may read internal standard operating procedures.
    roles: [contractor]
    tools: [docs.search, docs.read]
    actions: [read]
    labels: {max: internal}
    where:
      doc_tags_any: [sop]

  - id: staff-read
    effect: allow
    description: Staff may search and read documents up to internal.
    roles: [staff]
    tools: [docs.search, docs.read]
    actions: [read]
    labels: {max: internal}

  - id: manager-read
    effect: allow
    description: Managers may search and read documents up to confidential.
    roles: [manager]
    tools: [docs.search, docs.read]
    actions: [read]
    labels: {max: confidential}

  - id: owner-read
    effect: allow
    description: The owner may search and read every document, including restricted.
    roles: [owner]
    tools: [docs.search, docs.read]
    actions: [read]
    labels: {max: restricted}

  # Writing notes. Nobody writes restricted and contractors never write (default deny).
  - id: write-notes-internal
    effect: allow
    description: Staff may write knowledge-base notes on documents up to internal.
    roles: [staff]
    tools: [notes.write]
    actions: [write]
    labels: {max: internal}

  - id: write-notes-confidential
    effect: allow
    description: The owner and managers may write knowledge-base notes on documents up to confidential.
    roles: [owner, manager]
    tools: [notes.write]
    actions: [write]
    labels: {max: confidential}

  # Email. Any other recipient, and any contractor send, falls to default deny.
  - id: email-internal
    effect: allow
    description: Owner, managers and staff may email company addresses.
    roles: [owner, manager, staff]
    tools: [email.send]
    actions: [send]
    where:
      recipient_in: internal_addresses

  - id: email-customers
    effect: require_approval
    description: Emailing customers in the directory needs approval.
    roles: [owner, manager, staff]
    tools: [email.send]
    actions: [send]
    where:
      recipient_in: customer_directory

  - id: no-external-after-confidential
    effect: deny
    description: No run may email outside the company once it has read confidential or restricted data.
    tools: [email.send]
    actions: [send]
    where:
      run_max_label_gte: confidential
      recipient_external: true

  # Parts orders. Above each limit is default deny.
  - id: parts-order-up-to-500
    effect: allow
    description: The owner and managers may order parts up to 500 USD.
    roles: [owner, manager]
    tools: [parts.order]
    actions: [spend]
    where:
      amount_usd_lte: "500.00"

  - id: parts-order-approval-to-5000
    effect: require_approval
    description: Owner and manager parts orders above 500 and up to 5000 USD need approval.
    roles: [owner, manager]
    tools: [parts.order]
    actions: [spend]
    where:
      amount_usd_gt: "500.00"
      amount_usd_lte: "5000.00"

  - id: parts-order-staff-approval
    effect: require_approval
    description: Staff parts orders up to 200 USD need approval.
    roles: [staff]
    tools: [parts.order]
    actions: [spend]
    where:
      amount_usd_lte: "200.00"
