# Expected decisions for policies/kettle-creek-hvac. Role and customer come from the fixtures.
# `rules` lists the deciding rule ids in policy file order; it is omitted for default and
# built-in denies.

# Reads: contractor
- name: contractor reads a public service menu
  user: kc-contractor-hollis
  tool: docs.read
  action: read
  document: kc-service-menu
  expect: allow
  rules: [contractor-read-public]

- name: contractor searches public warranty terms
