# Parts orders
- name: manager orders parts at exactly 500.00
  user: kc-mgr-terrence
  tool: parts.order
  action: spend
  amount_usd: "500.00"
  expect: allow
  rules: [parts-order-up-to-500]

- name: manager orders parts at 500.01, which needs approval
  user: kc-mgr-terrence
  tool: parts.order
  action: spend
  amount_usd: "500.01"
  expect: require_approval
  rules: [parts-order-approval-to-5000]

- name: owner orders a small part
  user: kc-owner-dale
  tool: parts.order
  action: spend
  amount_usd: "42.75"
  expect: allow
  rules: [parts-order-up-to-500]

- name: owner orders parts at exactly 5000.00, which needs approval
  user: kc-owner-dale
  tool: parts.order
  action: spend
  amount_usd: "5000.00"
  expect: require_approval
  rules: [parts-order-approval-to-5000]

- name: owner orders parts at 5000.01, above every limit
  user: kc-owner-dale
  tool: parts.order
  action: spend
  amount_usd: "5000.01"
  expect: deny

- name: staff orders parts at exactly 200.00
  user: kc-staff-colby
  tool: parts.order
  action: spend
  amount_usd: "200.00"
  expect: require_approval
  rules: [parts-order-staff-approval]

- name: staff orders parts at 200.01
  user: kc-staff-colby
  tool: parts.order
  action: spend
  amount_usd: "200.01"
  expect: deny

- name: staff orders parts with no amount
  user: kc-staff-priya
  tool: parts.order
  action: spend
  expect: deny

- name: contractor orders a part
  user: kc-contractor-hollis
  tool: parts.order
  action: spend
  amount_usd: "10.00"
  expect: deny

