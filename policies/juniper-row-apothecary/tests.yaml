# Refunds
- name: staff refund at exactly 100.00
  user: jr-staff-tomas
  tool: refund.issue
  action: spend
  amount_usd: "100.00"
  expect: require_approval
  rules: [refund-staff-approval]

- name: staff refund at 100.01
  user: jr-staff-tomas
  tool: refund.issue
  action: spend
  amount_usd: "100.01"
  expect: deny

- name: manager refund at exactly 500.00
  user: jr-mgr-daniel
  tool: refund.issue
  action: spend
  amount_usd: "500.00"
  expect: require_approval
  rules: [refund-manager-approval]

- name: manager refund at 500.01
  user: jr-mgr-daniel
  tool: refund.issue
  action: spend
  amount_usd: "500.01"
  expect: deny

- name: owner refund at exactly 2000.00
  user: jr-owner-marisol
  tool: refund.issue
  action: spend
  amount_usd: "2000.00"
  expect: require_approval
  rules: [refund-owner-approval]

- name: owner refund at 2000.01
  user: jr-owner-marisol
  tool: refund.issue
  action: spend
  amount_usd: "2000.01"
  expect: deny

- name: owner small refund still needs approval
  user: jr-owner-marisol
  tool: refund.issue
  action: spend
  amount_usd: "12.50"
  expect: require_approval
  rules: [refund-owner-approval]

- name: staff refund with no amount
  user: jr-staff-hana
  tool: refund.issue
  action: spend
  expect: deny

- name: contractor issues a refund
  user: jr-contractor-gideon
  tool: refund.issue
  action: spend
  amount_usd: "5.00"
  expect: deny

